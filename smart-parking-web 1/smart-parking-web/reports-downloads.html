<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports &amp; Downloads - ADCET Smart Parking</title>
  <link rel="icon" href="images/adcet-logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/analytics.css">
  <script>
    if (sessionStorage.getItem("adcet_admin") !== "1") location.replace("admin-login.html");
  </script>
</head>
<body>

<div id="site-header"></div>

<div class="wrap">

  <div class="an-head">
    <h1>Reports &amp; Downloads</h1>
    <div class="an-actions">
      <span id="sample"></span>
    </div>
  </div>

  <div class="card no-print" style="margin-bottom:16px">
    <div class="tabs" id="types" style="margin-bottom:12px">
      <button class="tab on" data-t="daily"><span>Daily report</span></button>
      <button class="tab" data-t="weekly"><span>Weekly report</span></button>
      <button class="tab" data-t="monthly"><span>Monthly report</span></button>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
      <div style="min-width:190px"><label for="date" id="date-label">Select date</label><input type="date" id="date"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="b-pdf">Download PDF</button>
        <button class="btn" id="b-xlsx">Export Excel</button>
        <button class="btn secondary" id="b-print">Print report</button>
      </div>
    </div>
  </div>

  <div class="report" id="report">
    <div class="report-head">
      <img src="images/adcet-logo.png" alt="ADCET">
      <div>
        <h2>ADCET Smart Parking</h2>
        <p>Annasaheb Dange College of Engineering &amp; Technology, Ashta</p>
        <p><b id="r-title"></b> &middot; <span id="r-period"></span> &middot; <span style="font-weight:600;color:var(--ink)">PDF generated by Omkar Joshi</span></p>
      </div>
    </div>
    <div class="report-tiles" id="r-tiles"></div>
    <div id="r-days"></div>
    <h3 style="margin:18px 0 10px;color:var(--red-d)">Bookings made in this period</h3>
    <div class="table-wrap">
      <table class="data">
        <thead><tr><th>Booking ID</th><th>Vehicle</th><th>Slot</th><th>Booking date</th><th>Arrival</th><th>Exit</th><th>Billed</th><th>Amount</th><th>Payment</th><th>Status</th></tr></thead>
        <tbody id="r-rows"></tbody>
      </table>
    </div>
    <div class="an-note" id="r-note"></div>
  </div>

</div>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/export.js"></script>
<script src="js/analytics.js"></script>
<script>
  renderHeader("admin");
  renderSidebar("reports");
  renderFooter();

  const $ = id => document.getElementById(id);
  const D = AN.DAY, SLOTS = CONFIG.TOTAL_SLOTS;
  const h1 = v => (Math.round(v * 10) / 10) + " h";
  let type = "daily", rep = null;

  const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  $("date").value = ymd(new Date());

  function period() {
    const base = new Date(($("date").value || ymd(new Date())) + "T00:00:00");
    let from, to, label;
    if (type === "daily") {
      from = base.getTime(); to = from + D;
      label = base.toLocaleDateString("en-IN", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
    } else if (type === "weekly") {
      const mon = new Date(base); mon.setDate(base.getDate() - ((base.getDay() + 6) % 7));
      from = mon.getTime(); to = from + 7 * D;
      label = AN.dlabel(from) + " to " + AN.dlabel(to - D) + " " + new Date(to - D).getFullYear();
    } else {
      const a = new Date(base.getFullYear(), base.getMonth(), 1), b = new Date(base.getFullYear(), base.getMonth() + 1, 1);
      from = a.getTime(); to = b.getTime();
      label = a.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
    }
    return { from, to, label };
  }

  function build() {
    const p = period(), all = getBookings();
    const made = all.filter(b => { const t = new Date(b.bookedAt).getTime(); return t >= p.from && t < p.to; })
                    .sort((a, b) => new Date(a.bookedAt) - new Date(b.bookedAt));
    const ok = made.filter(AN.valid), bad = made.filter(AN.isCancelled);
    const used = all.filter(AN.valid).filter(b => AN.span(b));
    const days = Math.round((p.to - p.from) / D);
    const hrs = AN.usageHours(used, p.from, p.to);
    const money = ok.reduce((a, b) => a + AN.money(b), 0);
    const paid = ok.filter(b => b.payStatus === "Paid").reduce((a, b) => a + AN.money(b), 0);
    const startedHere = used.filter(b => { const s = AN.span(b)[0]; return s >= p.from && s < p.to; });
    const avg = startedHere.length ? startedHere.reduce((a, b) => { const s = AN.span(b); return a + (s[1] - s[0]) / AN.HR; }, 0) / startedHere.length : 0;
    const slotHrs = [...Array(SLOTS)].map((_, i) => AN.usageHours(used.filter(b => Number(b.slot) === i + 1), p.from, p.to));
    const best = Math.max.apply(null, slotHrs);

    const tiles = [
      ["Total bookings", made.length], ["Confirmed bookings", ok.length], ["Cancelled bookings", bad.length],
      ["Parked hours", h1(hrs)], ["Occupancy", Math.round(hrs / 24 / days / SLOTS * 100) + "%"],
      ["Average parking duration", startedHere.length ? h1(avg) : "-"],
      ["Most-used slot", best > 0 ? "Slot " + (slotHrs.indexOf(best) + 1) : "-"],
      ["Booking amount", rupees(money)], ["Collected (paid)", rupees(paid)], ["Pending (pay at exit)", rupees(money - paid)]
    ];

    // day-wise table for weekly / monthly reports
    const dayRows = [];
    if (type !== "daily") {
      for (let t = p.from; t < p.to; t += D) {
        const m = made.filter(b => { const x = new Date(b.bookedAt).getTime(); return x >= t && x < t + D; });
        const mo = m.filter(AN.valid), h = AN.usageHours(used, t, t + D);
        dayRows.push([AN.dlabel(t) + " " + new Date(t).toLocaleDateString("en-IN", { weekday: "short" }), m.length, mo.length, m.length - mo.length,
          h1(h), Math.round(h / 24 / SLOTS * 100) + "%", rupees(mo.reduce((a, b) => a + AN.money(b), 0))]);
      }
    }
    const names = { daily: "Daily report", weekly: "Weekly report", monthly: "Monthly report" };
    return { p, made, tiles, dayRows, title: names[type] };
  }

  const amount = b => b.status === "Completed" ? (b.finalAmount || b.amount) : b.amount;
  function chip(s) {
    const cls = { "Booked": "blue", "Active": "free", "Completed": "grey", "Cancelled": "full", "No-show": "reserved" }[s] || "grey";
    return '<span class="chip ' + cls + '">' + esc(s) + "</span>";
  }
  const bookingRow = b => [b.id, b.vehicle, "Slot " + b.slot, fmtDateTime(b.bookedAt), fmtDateTime(b.actualArrival || b.arrival),
    fmtDateTime(b.actualExit || b.exit), b.hours + " h", amount(b), b.payStatus, b.status];

  function draw() {
    rep = build();
    $("date-label").textContent = type === "daily" ? "Select date" : type === "weekly" ? "Pick any date in the week (Mon - Sun)" : "Pick any date in the month";
    $("r-title").textContent = rep.title;
    $("r-period").textContent = rep.p.label;
    $("r-tiles").innerHTML = rep.tiles.map(t => "<div><span>" + t[0] + "</span><b>" + esc(t[1]) + "</b></div>").join("");

    $("r-days").innerHTML = rep.dayRows.length
      ? '<h3 style="margin:0 0 10px;color:var(--red-d)">Day-wise summary</h3><div class="table-wrap"><table class="data"><thead><tr><th>Date</th><th>Bookings</th><th>Confirmed</th><th>Cancelled</th><th>Parked hours</th><th>Occupancy</th><th>Booking amount</th></tr></thead><tbody>' +
        rep.dayRows.map(r => "<tr>" + r.map(c => "<td>" + esc(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>"
      : "";

    $("r-rows").innerHTML = rep.made.length
      ? rep.made.map(b => { const r = bookingRow(b);
          return "<tr><td><b>" + esc(r[0]) + "</b></td><td>" + esc(r[1]) + "</td><td>" + r[2] + "</td><td>" + r[3] + "</td><td>" + r[4] + "</td><td>" + r[5] + "</td><td>" + r[6] + "</td><td>" + rupees(r[7]) + "</td><td>" + (b.payStatus === "Paid" ? '<span class="chip free">PAID</span>' : '<span class="chip reserved">PENDING</span>') + "</td><td>" + chip(b.status) + "</td></tr>"; }).join("")
      : '<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:22px">No bookings made in this period.</td></tr>';

    $("r-note").textContent = "Generated on " + new Date().toLocaleString("en-IN") + " | PDF generated by Omkar Joshi | All Rights Reserved by Omkar Joshi. Bookings are listed by the day they were made. Parked hours and occupancy are calculated from booking times; revenue counts confirmed bookings only (cancelled and no-show are excluded).";
  }

  const short = iso => iso ? new Date(iso).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "-";
  const fileBase = () => "adcet-parking-" + type + "-report-" + ($("date").value || ymd(new Date()));

  $("b-pdf").addEventListener("click", async () => {
    const btn = $("b-pdf"); btn.disabled = true;
    try {
      await Export.pdf({
        fileName: fileBase() + ".pdf", title: rep.title, subtitle: rep.p.label,
        summary: rep.tiles.map(t => [t[0], String(t[1])]),
        head: ["Booking ID", "Vehicle", "Slot", "Booking date", "Arrival", "Exit", "Billed", "Amount", "Payment", "Status"],
        widths: [1.2, 1.0, .55, 1.25, 1.25, 1.25, .55, .7, .7, .8],
        rows: rep.made.map(b => { const r = bookingRow(b); r[3] = short(b.bookedAt); r[4] = short(b.actualArrival || b.arrival); r[5] = short(b.actualExit || b.exit); r[7] = "Rs. " + r[7]; return r; })
      });
      toast("PDF downloaded");
    } catch (e) { toast("Could not create the PDF"); console.error(e); }
    btn.disabled = false;
  });

  $("b-xlsx").addEventListener("click", () => {
    const sheets = [
      { name: "Summary", rows: [["Item", "Value"], ["Report", rep.title], ["Period", rep.p.label]].concat(rep.tiles) },
    ];
    if (rep.dayRows.length) sheets.push({ name: "Day-wise", rows: [["Date", "Bookings", "Confirmed", "Cancelled", "Parked hours", "Occupancy", "Booking amount"]].concat(rep.dayRows) });
    sheets.push({ name: "Bookings", rows: [["Booking ID", "Vehicle", "Slot", "Booking date", "Arrival", "Exit", "Billed", "Amount (Rs.)", "Payment", "Status"]].concat(rep.made.map(bookingRow)) });
    Export.xlsx(fileBase() + ".xlsx", sheets);
    toast("Excel file downloaded");
  });

  $("b-print").addEventListener("click", () => window.print());

  $("types").addEventListener("click", e => {
    const t = e.target.closest(".tab");
    if (!t) return;
    type = t.dataset.t;
    document.querySelectorAll("#types .tab").forEach(x => x.classList.toggle("on", x === t));
    draw();
  });
  $("date").addEventListener("input", draw);

  AN.sampleButtons("sample", draw);
  draw();
  watchAdminBookings(draw);
</script>
</body>
</html>
