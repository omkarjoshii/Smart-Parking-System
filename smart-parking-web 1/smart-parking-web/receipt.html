<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking Receipt - ADCET Smart Parking</title>
  <link rel="icon" href="images/adcet-logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="wrap">
  <div class="receipt card" id="box">Loading...</div>
</div>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/qrcode.min.js"></script>
<script src="js/common.js"></script>
<script>
  renderHeader("find");
  renderFooter();

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const isNew = params.get("new") === "1";
  const box = document.getElementById("box");
  let lastDrawnState = "";

  function statusChip(s) {
    const cls = { "Booked": "blue", "Active": "free", "Completed": "grey", "Cancelled": "full", "No-show": "reserved" }[s] || "grey";
    return '<span class="chip ' + cls + '">' + esc(s) + "</span>";
  }

  function row(k, v) { return "<tr><td>" + k + "</td><td>" + v + "</td></tr>"; }

  async function draw() {
    const activeId = id || localStorage.getItem(LAST_USER_KEY) || (getBookings().slice(-1)[0] && getBookings().slice(-1)[0].id);
    let b = findBooking(activeId);
    if (id) {
      try { b = await fetchBooking(id); }
      catch (e) {
        if (!b) {
          box.innerHTML = "<h3>Booking unavailable</h3><p>" + esc(e.message) + "</p>" +
            '<a class="btn" href="index.html">Back to home</a>';
          return;
        }
      }
    }
    if (!b) {
      box.innerHTML = "<h3>Booking not found</h3><p>This booking is not saved on this device.</p>" +
        '<a class="btn" href="index.html">Back to home</a>';
      return;
    }

    const currentState = b.id + "_" + b.status + "_" + (b.actualArrival || "") + "_" + (b.actualExit || "") + "_" + b.payStatus;
    if (currentState === lastDrawnState) return;
    lastDrawnState = currentState;

    const brandHeader =
      '<div class="receipt-header">' +
        '<div style="display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:18px">' +
          '<img src="images/adcet-logo.png" alt="ADCET Logo" style="width:62px;height:62px;object-fit:contain;background:#fff;border-radius:10px;padding:2px">' +
          '<div>' +
            '<h2 style="margin:0;font-size:20px;color:#0f172a;letter-spacing:-0.2px">ADCET Smart Parking</h2>' +
            '<div style="font-size:12px;color:var(--muted)">Annasaheb Dange College of Engineering &amp; Technology, Ashta</div>' +
          '</div>' +
          '<div style="margin-left:auto;text-align:right">' +
            '<span class="chip blue" style="font-size:11.5px;font-weight:700;letter-spacing:0.5px">PARKING INVOICE</span>' +
          '</div>' +
        '</div>' +
      '</div>';

    const head = isNew
      ? '<div class="tick">&#10003;</div><h3 style="text-align:center;margin:0 0 4px;font-size:18px;color:#0f172a">Booking Confirmed!</h3>' +
        '<p style="text-align:center;color:var(--muted);margin:0 0 16px">Thank you, ' + esc(b.name.split(" ")[0]) +
        ". Your parking slot is reserved.</p>"
      : "<h3 style=\"margin:0 0 14px;font-size:18px;color:#0f172a\">Booking Details</h3>";

    const qrCard =
      '<div class="receipt-qr-card">' +
        '<div class="receipt-qr-wrap" id="receipt-qrcode"></div>' +
        '<div class="receipt-qr-details">' +
          '<span class="receipt-qr-tag">Digital Pass &bull; Gate Verification</span>' +
          '<div class="receipt-qr-slot">Slot Allocation: <span class="slot-num">Slot ' + b.slot + '</span></div>' +
          '<div class="receipt-qr-id">Booking ID: ' + esc(b.id) + ' &bull; ' + esc(b.vehicle) + '</div>' +
          '<div class="receipt-qr-inst">Show this QR code at the entrance or exit gate. Admin or camera scanner will verify your slot and grant access.</div>' +
          '<div style="margin-top:10px" class="no-print">' +
            '<button class="btn small secondary" id="btn-dl-qr" style="font-size:12px;padding:5px 12px;display:inline-flex;align-items:center;gap:6px">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> Save QR Pass' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    const finalRows = b.status === "Completed"
      ? row("Actual arrival", fmtDateTime(b.actualArrival || b.arrival)) +
        row("Actual exit", fmtDateTime(b.actualExit)) +
        row("Time parked", fmtDuration(b.actualArrival || b.arrival, b.actualExit))
      : (b.status === "Active" ? row("Arrived at", fmtDateTime(b.actualArrival)) : "");

    const total = b.status === "Completed" ? b.finalAmount : b.amount;

    box.innerHTML = brandHeader + head + qrCard +
      '<div class="top"><div><div style="color:var(--muted);font-size:13px">Booking ID</div>' +
      '<div class="id">' + esc(b.id) + "</div></div><div>" + statusChip(b.status) + "</div></div>" +
      '<table class="summary-table">' +
        row("Name", esc(b.name)) +
        row("Mobile", esc(b.mobile)) +
        row("Address", esc(b.address)) +
        row("Vehicle number", "<b>" + esc(b.vehicle) + "</b> (" + esc(b.vtype) + ")") +
        row("Parking slot", "<b>Slot " + b.slot + "</b>") +
        row("Booked on", fmtDateTime(b.bookedAt)) +
        row("Arrival time", fmtDateTime(b.arrival)) +
        row("Exit time", fmtDateTime(b.exit)) +
        finalRows +
        row("Payment method", esc(b.method)) +
        row("Payment status", b.payStatus === "Paid"
          ? '<span class="chip free">PAID</span>' + (b.txn ? " &nbsp;" + esc(b.txn) : "")
          : '<span class="chip reserved">PAY AT EXIT</span>') +
        '<tr class="total"><td>' + (b.status === "Completed" ? "Final amount" : "Amount") + "</td><td>" + rupees(total) + "</td></tr>" +
      "</table>" +
      '<div class="receipt-footer" style="margin-top:24px;padding-top:16px;border-top:1.5px dashed var(--line);display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px">' +
        '<div>' +
          '<div style="font-size:14px;font-weight:700;color:#0f172a;margin-bottom:3px">&#10024; Thanks for connecting with ADCET Smart Parking!</div>' +
          '<div style="font-size:12px;color:var(--muted)">Please present this invoice/receipt or QR pass at the entrance or exit gate.</div>' +
          '<div style="font-size:11px;color:var(--muted);margin-top:4px">&copy; ' + new Date().getFullYear() + ' All Rights Reserved by Omkar Joshi</div>' +
        '</div>' +
        '<div style="text-align:right">' +
          '<div style="font-size:12px;color:var(--muted);font-weight:600">Regards,</div>' +
          '<div style="font-size:16px;font-weight:800;color:#0f172a;letter-spacing:0.3px">Omkar Joshi</div>' +
        '</div>' +
      '</div>' +
      '<div class="actions no-print">' +
        '<a class="btn secondary" href="index.html">Home</a>' +
        '<span><button class="btn secondary" onclick="window.print()">Print</button> ' +
        (b.status === "Booked" ? '<button class="btn grey" id="cancel">Cancel booking</button> ' : "") +
        '<a class="btn" href="book.html">New booking</a></span>' +
      "</div>";

    // Generate QR code
    const qrContainer = document.getElementById("receipt-qrcode");
    if (qrContainer && typeof QRCode !== "undefined") {
      qrContainer.innerHTML = "";
      const payload = makeBookingQRPayload(b);
      try {
        new QRCode(qrContainer, {
          text: payload,
          width: 136,
          height: 136,
          colorDark: "#0f172a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      } catch (err) {
        console.error("QR generation error:", err);
      }
    }

    // Save QR Pass handler
    const dlBtn = document.getElementById("btn-dl-qr");
    if (dlBtn) {
      dlBtn.addEventListener("click", () => {
        const qrImg = qrContainer.querySelector("img") || qrContainer.querySelector("canvas");
        if (!qrImg) return;
        const canvas = document.createElement("canvas");
        canvas.width = 400;
        canvas.height = 470;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 400, 470);
        
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, 400, 72);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("ADCET Smart Parking", 200, 32);
        ctx.font = "12px sans-serif";
        ctx.fillStyle = "#94a3b8";
        ctx.fillText("Official Gate Entry Pass", 200, 54);

        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = qrImg.src || (qrImg.toDataURL ? qrImg.toDataURL() : "");
        img.onload = () => {
          ctx.drawImage(img, 130, 95, 140, 140);
          ctx.fillStyle = "#16a34a";
          ctx.fillRect(40, 265, 320, 42);
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 20px sans-serif";
          ctx.fillText("RESERVED: SLOT " + b.slot, 200, 294);

          ctx.fillStyle = "#0f172a";
          ctx.font = "bold 15px monospace";
          ctx.fillText(b.id, 200, 335);

          ctx.fillStyle = "#334155";
          ctx.font = "bold 13px sans-serif";
          ctx.fillText(b.vehicle + " (" + (b.vtype || "Vehicle") + ")", 200, 360);

          ctx.fillStyle = "#64748b";
          ctx.font = "12px sans-serif";
          ctx.fillText("Driver: " + b.name + " (" + b.mobile + ")", 200, 385);
          ctx.fillText("Scheduled: " + fmtDateTime(b.arrival), 200, 408);

          ctx.fillStyle = "#dc2626";
          ctx.font = "bold 12px sans-serif";
          ctx.fillText("SCAN AT ENTRANCE/EXIT GATE", 200, 442);

          const a = document.createElement("a");
          a.href = canvas.toDataURL("image/png");
          a.download = "ADCET-Parking-Pass-" + b.id + ".png";
          a.click();
        };
        if (img.complete) img.onload();
      });
    }

    const c = document.getElementById("cancel");
    if (c) c.addEventListener("click", () => {
      if (confirm("Cancel this booking?")) {
        updateBooking(b.id, { status: "Cancelled" })
          .then(() => { lastDrawnState = ""; draw(); })
          .catch(e => toast(e.message || "Booking could not be cancelled."));
      }
    });
  }

  draw();
  setInterval(draw, 4000);   // keep status in step with admin changes
</script>
</body>
</html>
